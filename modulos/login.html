<form id="frmLogin">
    <div class="card text-bg-dark" style="min-width: 400px;">
        <div class="card-header">INICIAR SESIÓN</div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="txtUsuario" class="form-label">Usuario</label>
                        <input required type="text" id="txtUsuario" name="txtUsuario" 
                               class="form-control form-control-sm" />
                    </div>
                </div>
            </div>
            <div class="row p-1">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="txtClave" class="form-label">Contraseña</label>
                        <input required type="password" id="txtClave" name="txtClave" 
                               class="form-control form-control-sm" />
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer text-center">
            <input type="submit" id="btnLogin" name="btnLogin" 
                   class="btn btn-primary" value="INGRESAR" />
        </div>
    </div>
</form>

<script>
    frmLogin.addEventListener("submit", e => {
        e.preventDefault();
        validarLogin();
    });

    async function validarLogin() {
        let datos = {
            usuario: txtUsuario.value,
            clave: txtClave.value
        };

        let response = await fetch("/login", {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        });

        let respuesta = await response.json();

        if (respuesta.msg === "ok") {
            alertify.success("Acceso concedido");
            // Redirigir al sistema principal
            window.location.href = "/sistema";
        } else {
            alertify.error("Usuario o contraseña incorrectos");
            txtClave.value = "";
            txtUsuario.focus();
        }
    }
</script>
